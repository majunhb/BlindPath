name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '19 18 * * 0'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: java-kotlin
          build-mode: manual
        - language: python
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    # 针对 java-kotlin 的 manual 构建
    - name: Set up JDK 17
      if: matrix.language == 'java-kotlin'
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle

    - name: Setup Android SDK
      if: matrix.language == 'java-kotlin'
      uses: android-actions/setup-android@v3

    - name: Create local.properties
      if: matrix.language == 'java-kotlin'
      run: |
        echo "BAIDU_APP_ID=" > local.properties
        echo "BAIDU_API_KEY=" >> local.properties
        echo "BAIDU_SECRET_KEY=" >> local.properties
        echo "IFLYTEK_APP_ID=" >> local.properties
        echo "IFLYTEK_API_KEY=" >> local.properties
        echo "IFLYTEK_API_SECRET=" >> local.properties

    - name: Build for CodeQL (java-kotlin)
      if: matrix.language == 'java-kotlin'
      run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
