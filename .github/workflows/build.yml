name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK (preinstalled)
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          echo "GRADLE_OPTS=-Dorg.gradle.daemon=false -Dorg.gradle.internal.network.timeout=300000" >> $GITHUB_ENV

      - name: Deep Clean
        run: |
          ./gradlew clean --no-daemon || true
          rm -rf ~/.gradle/caches/build-cache-1/*
          rm -rf app/build/ module_*/build/ base/build/
          find . -path "*/build/*" -type d -exec rm -rf {} + 2>/dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Inject API credentials
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "BAIDU_APP_ID=${{ secrets.BAIDU_APP_ID }}" >> ~/.gradle/gradle.properties
          echo "BAIDU_API_KEY=${{ secrets.BAIDU_API_KEY }}" >> ~/.gradle/gradle.properties
          echo "BAIDU_SECRET_KEY=${{ secrets.BAIDU_SECRET_KEY }}" >> ~/.gradle/gradle.properties
          echo "IFLYTEK_APP_ID=${{ secrets.IFLYTEK_APP_ID }}" >> ~/.gradle/gradle.properties
          echo "IFLYTEK_API_KEY=${{ secrets.IFLYTEK_API_KEY }}" >> ~/.gradle/gradle.properties
          echo "IFLYTEK_API_SECRET=${{ secrets.IFLYTEK_API_SECRET }}" >> ~/.gradle/gradle.properties

      - name: Check AI model
        run: |
          MODEL_FILE="app/src/main/assets/yolov8n.tflite"
          if [ -f "$MODEL_FILE" ]; then
            FILE_SIZE=$(wc -c < "$MODEL_FILE")
            echo "Model file size: $FILE_SIZE bytes"
            if [ "$FILE_SIZE" -lt 1024 ]; then
              echo "::warning::Model is a Git LFS placeholder."
            fi
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --rerun-tasks

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
