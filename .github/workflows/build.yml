name: Android CI

on:
  # Push 到 main 分支时触发
  push:
    branches: [ main ]
  # PR 到 main 分支时触发
  pull_request:
    branches: [ main ]
  # 手动触发
  workflow_dispatch:

# 并发控制：同一分支只保留最新构建
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (preinstalled)
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "Preinstalled SDK: $ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/platforms/" 2>/dev/null || true
          ls "$ANDROID_SDK_ROOT/build-tools/" 2>/dev/null || true


      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Inject API credentials
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          mkdir -p ~/.gradle
          echo "BAIDU_APP_ID=${{ secrets.BAIDU_APP_ID }}" >> ~/.gradle/gradle.properties
          echo "BAIDU_API_KEY=${{ secrets.BAIDU_API_KEY }}" >> ~/.gradle/gradle.properties
          echo "BAIDU_SECRET_KEY=${{ secrets.BAIDU_SECRET_KEY }}" >> ~/.gradle/gradle.properties
          echo "IFLYTEK_APP_ID=${{ secrets.IFLYTEK_APP_ID }}" >> ~/.gradle/gradle.properties
          echo "IFLYTEK_API_KEY=${{ secrets.IFLYTEK_API_KEY }}" >> ~/.gradle/gradle.properties
          echo "IFLYTEK_API_SECRET=${{ secrets.IFLYTEK_API_SECRET }}" >> ~/.gradle/gradle.properties
          echo "Credentials injected"

          echo "Credentials injected into ~/.gradle/gradle.properties"


      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
         

      - name: Report success
        if: success()
        run: |
          echo "✅ Build completed successfully!"
          echo "📦 Build type: debug"
          echo "📱 APK artifact uploaded with 7-day retention"
