name: Android CI

on:
  # Push 到 main 分支时触发
  push:
    branches: [ main ]
  # PR 到 main 分支时触发
  pull_request:
    branches: [ main ]
  # 手动触发
  workflow_dispatch:

# 并发控制：同一分支只保留最新构建
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (preinstalled)
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "Preinstalled SDK: $ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/platforms/" 2>/dev/null || true
          ls "$ANDROID_SDK_ROOT/build-tools/" 2>/dev/null || true


      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Inject API credentials
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          mkdir -p ~/.gradle
          echo "BAIDU_APP_ID=${{ secrets.BAIDU_APP_ID }}" >> ~/.gradle/gradle.properties
          echo "BAIDU_API_KEY=${{ secrets.BAIDU_API_KEY }}" >> ~/.gradle/gradle.properties
          echo "BAIDU_SECRET_KEY=${{ secrets.BAIDU_SECRET_KEY }}" >> ~/.gradle/gradle.properties
          echo "IFLYTEK_APP_ID=${{ secrets.IFLYTEK_APP_ID }}" >> ~/.gradle/gradle.properties
          echo "IFLYTEK_API_KEY=${{ secrets.IFLYTEK_API_KEY }}" >> ~/.gradle/gradle.properties
          echo "IFLYTEK_API_SECRET=${{ secrets.IFLYTEK_API_SECRET }}" >> ~/.gradle/gradle.properties
          echo "Credentials injected"

          echo "Credentials injected into ~/.gradle/gradle.properties"
         
      - name: Prepare AI model (yolov8n.tflite)
        run: |
          MODEL_FILE="app/src/main/assets/yolov8n.tflite"
          FILE_SIZE=0
          if [ -f "$MODEL_FILE" ]; then
            FILE_SIZE=$(wc -c < "$MODEL_FILE")
          fi
          echo "Current model file size: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -gt 1024 ]; then
            echo "✅ Model already exists: $FILE_SIZE bytes"
            ls -lh "$MODEL_FILE"
            exit 0
          fi
          mkdir -p "$(dirname "$MODEL_FILE")"
          # 方法1: 使用 git-lfs 拉取
          echo "Trying git-lfs..."
          git lfs fetch --include="*.tflite" 2>/dev/null && git lfs checkout 2>/dev/null
          if [ -f "$MODEL_FILE" ]; then
            FILE_SIZE=$(wc -c < "$MODEL_FILE")
            if [ "$FILE_SIZE" -gt 1024 ]; then
              echo "✅ Model fetched via git-lfs: $FILE_SIZE bytes"
              ls -lh "$MODEL_FILE"
              exit 0
            fi
          fi
          # 方法2: 使用 Python + ultralytics 导出 TFLite 模型
          echo "LFS failed, exporting TFLite model via Python..."
          pip install ultralytics --quiet
          python3 -c "
from ultralytics import YOLO
import os
model = YOLO('yolov8n')
model.export(format='tflite', imgsz=320)
# 找到导出的文件并复制
import glob
files = glob.glob('yolov8n*.tflite')
if files:
    import shutil
    shutil.copy(files[0], '$MODEL_FILE')
    print(f'Exported {files[0]} to $MODEL_FILE')
else:
    print('Export failed')
    exit(1)
"
          ls -lh "$MODEL_FILE"
          FILE_SIZE=$(wc -c < "$MODEL_FILE")
          echo "Final model file size: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -lt 1024 ]; then
            echo "::error::Model file is too small ($FILE_SIZE bytes). Obstacle detection will NOT work!"
            exit 1
          fi


      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
         

      - name: Report success
        if: success()
        run: |
          echo "✅ Build completed successfully!"
          echo "📦 Build type: debug"
          echo "📱 APK artifact uploaded with 7-day retention"
