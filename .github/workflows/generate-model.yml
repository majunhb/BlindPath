name: Generate Model

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/export_model.py'
      - 'scripts/download_model.py'
      - '.github/workflows/generate-model.yml'

jobs:
  generate-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install ultralytics tensorflow

      - name: Download and export model
        run: |
          python scripts/export_model.py

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: yolov8n-model
          path: app/src/main/assets/yolov8n.tflite
          retention-days: 30

      - name: Create Release with model
        uses: softprops/action-gh-release@v2
        with:
          tag_name: models-v1
          name: YOLOv8n Detection Model
          body: |
            ## YOLOv8n 障碍物检测模型
            
            用于 BlindPath 应用的障碍物检测功能。
            
            - 模型大小: ~6MB
            - 输入尺寸: 320x320
            - 格式: TensorFlow Lite (float32)
            
            ### 使用方法
            1. 下载 `yolov8n.tflite` 文件
            2. 放入应用 `assets` 目录
            3. 或让应用自动从 GitHub Releases 下载
          draft: false
          files: |
            app/src/main/assets/yolov8n.tflite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
