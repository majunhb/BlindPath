name: Publish Release

on:
  # 创建 tag 时自动触发（格式：v*.*.*）
  push:
    tags:
      - 'v*.*.*'
  # 手动触发
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如：1.0.0，无需 v 前缀）'
        required: true
        default: '1.0.0'
      prerelease:
        description: '是否为预发布版本'
        required: false
        default: false
        type: boolean

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 创建 Release 所需权限
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (signed)
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Get version name
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Tag 触发，使用 tag 名称（去掉 v 前缀）
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            # 手动触发，使用输入的版本号
            VERSION=${{ github.event.inputs.version }}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/BlindPath-v${{ steps.version.outputs.version }}-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: BlindPath ${{ steps.version.outputs.tag }}
          body: |
            ## BlindPath ${{ steps.version.outputs.tag }}
            
            ### 下载说明
            - 下载 `BlindPath-v${{ steps.version.outputs.version }}-debug.apk` 安装使用
            - 此为 Debug 签名版本，适合测试和内部使用
            
            ### 更新内容
            请在此处填写更新说明...
            
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
          files: |
            app/build/outputs/apk/debug/BlindPath-v${{ steps.version.outputs.version }}-debug.apk
            app/build/outputs/apk/release/BlindPath-v${{ steps.version.outputs.version }}-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## ✅ 发布成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**版本**: ${{ steps.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**APK**: BlindPath-v${{ steps.version.outputs.version }}-debug.apk" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[查看 Release](https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }})" >> $GITHUB_STEP_SUMMARY
