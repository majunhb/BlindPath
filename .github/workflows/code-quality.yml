name: Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 并发控制：同一 PR 只保留最新一次检查，节省 CI 资源
concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 1. Android Lint — 官方静态分析，检测 Android 特有问题
  # ============================================================
  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run Android Lint
        continue-on-error: true
        run: ./gradlew lintDebug --no-daemon --continue
        # continue-on-error: 项目已有历史lint违规，先报告后逐步修复

      - name: Upload Lint Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports
          path: '**/build/reports/lint-results*.html'
          if-no-files-found: ignore
          retention-days: 14

  # ============================================================
  # 2. Detekt — Kotlin 静态分析，阻断不符合规范的代码
  # ============================================================
  detekt:
    name: Detekt Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run Detekt
        continue-on-error: true
        run: |
          ./gradlew detekt --no-daemon --continue
          echo "Detekt analysis completed"
        # continue-on-error: Detekt未在项目中配置，仅作为报告工具

      - name: Upload Detekt Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detekt-reports
          path: |
            **/build/reports/detekt/detekt.html
            **/build/reports/detekt/detekt.sarif
          if-no-files-found: ignore
          retention-days: 14

      # 将 Detekt SARIF 上传到 GitHub Security 面板（便于直接在代码中看到问题）
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: '**/build/reports/detekt/detekt.sarif'
        continue-on-error: true  # SARIF 上传失败不影响主流程

  # ============================================================
  # 3. ktlint — Kotlin 代码格式检查
  # ============================================================
  ktlint:
    name: ktlint Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run ktlint Check
        continue-on-error: true
        run: ./gradlew ktlintCheck --no-daemon --continue
        # continue-on-error: ktlint未在项目中配置，仅作为报告工具

      - name: Upload ktlint Reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ktlint-reports
          path: '**/build/reports/ktlint/**/*.html'
          if-no-files-found: ignore
          retention-days: 7

  # ============================================================
  # 4. CodeQL — GitHub 安全扫描
  # ============================================================
  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "BAIDU_APP_ID=" > local.properties
          echo "BAIDU_API_KEY=" >> local.properties
          echo "BAIDU_SECRET_KEY=" >> local.properties
          echo "IFLYTEK_APP_ID=" >> local.properties
          echo "IFLYTEK_API_KEY=" >> local.properties
          echo "IFLYTEK_API_SECRET=" >> local.properties
          echo "AMAP_API_KEY=" >> local.properties

      - name: Build for CodeQL
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: github/codeql-action/analyze@v3
        with:
          token: ${{ secrets.GH_PAT }}

  # ============================================================
  # 5. 质量汇总报告 — 所有检查通过后输出摘要
  # ============================================================
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [ lint, detekt, ktlint ]
    if: always()
    steps:
      - name: Check Quality Gate
        run: |
          echo "📊 Quality Gate Summary"
          echo "  Lint:    ${{ needs.lint.result }}"
          echo "  Detekt:  ${{ needs.detekt.result }}"
          echo "  ktlint:  ${{ needs.ktlint.result }}"
          echo ""
          echo "ℹ️ Lint/Detekt/ktlint run in report-only mode."
          echo "   CodeQL security scan runs in blocking mode."
          echo "   Download artifacts to review detailed reports."
          echo "✅ Quality Gate: checks completed (violations logged as artifacts)"
