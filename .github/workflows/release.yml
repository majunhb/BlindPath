name: Release Build (Debug Signed)

# 注意：此工作流构建 Debug 签名的 APK
# 如需构建正式 Release APK，需要配置签名密钥：
# 1. 创建 keystore 文件
# 2. 在 app/build.gradle.kts 中配置 signingConfigs
# 3. 在 GitHub Secrets 中存储密钥信息
# 4. 修改此工作流使用 assembleRelease

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: 1.0.0)'
        required: true
        default: '1.0.0'
      description:
        description: '更新说明'
        required: false
        default: 'Release build'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ============================================
      # 构建 Debug APK（使用 Debug 签名）
      # ============================================
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: debug-apk-v${{ github.event.inputs.version }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # ============================================
      # 构建完成通知
      # ============================================
      - name: Report success
        if: success()
        run: |
          echo "✅ Debug build completed successfully!"
          echo "📦 Version: ${{ github.event.inputs.version }}"
          echo "📝 Description: ${{ github.event.inputs.description }}"
          echo ""
          echo "⚠️ 注意：此为 Debug 签名版本，适合测试使用"
