name: Android CI - Build APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode google-services.json (if configured)
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -n "$GOOGLE_SERVICES_JSON" ]; then
          mkdir -p app/src/debug
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          echo "google-services.json restored"
        else
          echo "GOOGLE_SERVICES_JSON not set, skipping"
        fi

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BlindPath-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Build Release APK (if keystore configured)
      if: false  # 默认不构建 Release，需要配置 secrets 后启用
      run: ./gradlew assembleRelease --stacktrace
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Upload Release APK (if built)
      if: false
      uses: actions/upload-artifact@v4
      with:
        name: BlindPath-Release-APK
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
