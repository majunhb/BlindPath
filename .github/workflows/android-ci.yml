name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Create credentials.properties
        run: |
          mkdir -p module_voice/src/main/assets
          printf "BAIDU_APP_ID=%s\nBAIDU_API_KEY=%s\nBAIDU_SECRET_KEY=%s\nIFLYTEK_APP_ID=%s\nIFLYTEK_API_KEY=%s\nIFLYTEK_API_SECRET=%s\nAMAP_API_KEY=%s\nAMAP_WEB_KEY=%s\nPORCUPINE_ACCESS_KEY=%s\n" \
            "$BAIDU_APP_ID" "$BAIDU_API_KEY" "$BAIDU_SECRET_KEY" \
            "$IFLYTEK_APP_ID" "$IFLYTEK_API_KEY" "$IFLYTEK_API_SECRET" \
            "$AMAP_API_KEY" "$AMAP_WEB_KEY" \
            "$PORCUPINE_ACCESS_KEY" \
            > module_voice/src/main/assets/credentials.properties
        env:
          BAIDU_APP_ID: ${{ secrets.BAIDU_APP_ID || '123695740' }}
          BAIDU_API_KEY: ${{ secrets.BAIDU_API_KEY || '1GTijw1LfvwxmqFBwTTo3YHu' }}
          BAIDU_SECRET_KEY: ${{ secrets.BAIDU_SECRET_KEY || '7EodIPDziWTK5Wu9kp7WiuRCQPgerlnM' }}
          IFLYTEK_APP_ID: ${{ secrets.IFLYTEK_APP_ID || 'a6ca8716' }}
          IFLYTEK_API_KEY: ${{ secrets.IFLYTEK_API_KEY || '51b94ffb022748cd1296d764c1be060f' }}
          IFLYTEK_API_SECRET: ${{ secrets.IFLYTEK_API_SECRET || 'OTJkZDUzN2MzNzA0ZmRjNGFlNzM4N2Iz' }}
          AMAP_API_KEY: ${{ secrets.AMAP_API_KEY || '02d60524af990e3835f0b835ab5403e9' }}
          AMAP_WEB_KEY: ${{ secrets.AMAP_WEB_KEY || '63dabd8e0b1e43f10f0b4586393e52e6' }}
          PORCUPINE_ACCESS_KEY: ${{ secrets.PORCUPINE_ACCESS_KEY || '' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk