# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx1024m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true -Djdk.httpclient.HttpClient.log=trace
org.gradle.parallel=false
org.gradle.caching=true

# Android settings
android.useAndroidX=true
android.enableJetifier=true

# Kotlin
kotlin.code.style=official

# KSP - disable incremental compilation to avoid Hilt FileAlreadyExistsException
ksp.incremental=false

# Non-transitive R classes
android.nonTransitiveRClass=true

# Disable JDK image generation (workaround for missing jlink in JBR)
android.experimental.legacyTransform.forceNonIncremental=true

# Network settings
systemProp.http.proxyHost=
systemProp.http.proxyPort=
systemProp.https.proxyHost=
systemProp.https.proxyPort=
systemProp.org.gradle.internal.http.socketTimeout=300000
systemProp.org.gradle.internal.http.connectionTimeout=300000
