# Project-wide Gradle settings
# Increase JVM heap to 4GB for D8 dex merging (GitHub Actions has 7GB RAM)
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Android settings
android.useAndroidX=true
android.enableJetifier=true

# Kotlin
kotlin.code.style=official

# KSP - disable incremental compilation to avoid Hilt FileAlreadyExistsException
ksp.incremental=false

# Non-transitive R classes
android.nonTransitiveRClass=true

# Disable JDK image generation (workaround for missing jlink in JBR)
android.experimental.legacyTransform.forceNonIncremental=true

# Network settings
systemProp.org.gradle.internal.http.socketTimeout=300000
systemProp.org.gradle.internal.http.connectionTimeout=300000
