# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Android settings
android.useAndroidX=true
android.enableJetifier=true

# Kotlin
kotlin.code.style=official

# Non-transitive R classes
android.nonTransitiveRClass=true

kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m
kotlin.incremental=true

# [国内镜像] 备用仓库配置（CI 中通过 init.gradle 覆盖）
systemProp.https.proxyHost=ghfast.top
systemProp.https.proxyPort=80
systemProp.http.proxyHost=ghfast.top
systemProp.http.proxyPort=80
